<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Instructor · Checkpoint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/student.css">
<link rel="stylesheet" href="css/admin.css">
<!-- React + Babel let you try React questions in the question editor.
     Served from this folder, not a CDN: a blocked or slow CDN must not break a test in progress.
     Versions, and how to refresh them: vendor/README.md -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/babel.min.js"></script>
<script type="module" src="js/admin/app.js"></script>
</head>
<body class="admin">
<div class="demo-bar" id="demoBar" hidden>Demo mode: data lives in this browser only. Instructor login: demo@example.com / demo1234. <button type="button" id="resetDemo">Reset demo data</button></div>
<header class="top">
  <div class="top-inner">
    <div class="brand" id="brand">Checkpoint <span>·</span> Instructor</div>
    <span class="who" id="who"></span>
    <button class="chip" id="signOut" type="button" hidden>Sign out</button>
  </div>
  <nav class="tabs" id="nav" hidden>
    <a class="tab" href="#/live" data-tab="live">Live</a>
    <a class="tab" href="#/sessions" data-tab="sessions">Sessions</a>
    <a class="tab" href="#/questions" data-tab="questions">Questions</a>
    <a class="tab" href="#/instructors" data-tab="instructors" id="tabInstructors" hidden>Instructors<b class="badge" id="pendingCount" hidden></b></a>
  </nav>
</header>
<main class="wrap" id="view"></main>
<div class="overlay light" id="gate">
  <div class="sheet" id="gateSheet"><h1>Instructor</h1><p class="note">Loading…</p></div>
</div>
</body>
</html>
